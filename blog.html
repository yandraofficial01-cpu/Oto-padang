<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog OtoPadang - Tips Mobil Bekas & Review Otomotif Padang</title>

    <!-- SEO WAJIB BUAT GOOGLE DISCOVER -->

    <meta name="keywords" content="mobil bekas padang, harga mobil padang, tips otomotif, review mobil, cek mobil bekas, otopadang">
    <meta name="author" content="OtoPadang">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://otopadang.com/blog">
    
    <!-- OPEN GRAPH BUAT THUMBNAIL DI WA/FB/DISCOVER -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OtoPadang">
    <meta property="og:title" content="Blog OtoPadang - Tips Otomotif Terpercaya">
    <meta property="og:description" content="Tips, review, dan info dunia otomotif terpercaya dari Padang">
    <meta property="og:image" content="https://otopadang.com/og-image.jpg">
    <meta property="og:url" content="https://otopadang.com/blog">
    <meta property="og:locale" content="id_ID">
    
    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog OtoPadang">
    <meta name="twitter:description" content="Tips, review, dan info dunia otomotif terpercaya dari Padang">
    <meta name="twitter:image" content="https://otopadang.com/og-image.jpg">
    
    <!-- SCHEMA.ORG BLOG -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "Blog OtoPadang",
      "description": "Tips, review, dan info dunia otomotif terpercaya dari Padang",
      "url": "https://otopadang.com/blog",
      "publisher": {
        "@type": "Organization",
        "name": "OtoPadang",
        "logo": {
          "@type": "ImageObject",
          "url": "https://otopadang.com/logo.png"
        }
      },
      "inLanguage": "id-ID"
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
          --brand: #0066cc;
          --brand-dark: #004d99;
          --text: #1a1a1a;
          --muted: #666;
          --bg: #f8f9fa;
          --card: #fff;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
          max-width: 1200px; 
          margin: 0 auto; 
          padding: 24px 16px;
          background: var(--bg);
          color: var(--text);
          display: flex;
          flex-direction: column;
          min-height: 100vh;
        }
        main { flex: 1; }
        .header {
          text-align: center;
          margin-bottom: 40px;
        }
        h1 { 
          font-size: 2.5rem; 
          font-weight: 800;
          margin: 0 0 8px 0;
        }
        .subtitle {
          color: var(--muted);
          font-size: 16px;
          margin-bottom: 24px;
        }
        .breadcrumb {
          font-size: 14px;
          color: var(--muted);
          margin-bottom: 16px;
        }
        .breadcrumb a {
          color: var(--brand);
          text-decoration: none;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .back-link {
          color: var(--brand);
          text-decoration: none;
          font-weight: 600;
          font-size: 15px;
          display: inline-block;
          margin-bottom: 24px;
        }
        .back-link:hover { text-decoration: underline; }
        
        .blog-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
          gap: 24px;
        }
        
        .post {
          background: var(--card);
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 2px 8px rgba(0,0,0,0.06);
          transition: all 0.3s ease;
          border: 1px solid #eee;
          display: flex;
          flex-direction: column;
        }
        .post:hover {
          transform: translateY(-4px);
          box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .post-thumb {
          width: 100%;
          height: 200px;
          object-fit: cover;
          display: block;
          background: #f0f0f0;
        }
        .post-body {
          padding: 20px;
          display: flex;
          flex-direction: column;
          flex: 1;
        }
        .post h2 { 
          margin: 0 0 8px 0; 
          font-size: 1.25rem;
          font-weight: 700;
          line-height: 1.4;
        }
        .post h2 a { 
          color: var(--text); 
          text-decoration: none; 
        }
        .post h2 a:hover { 
          color: var(--brand); 
        }
        .post-excerpt {
          color: var(--muted);
          font-size: 14px;
          line-height: 1.5;
          margin: 0 0 16px 0;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          flex: 1;
        }
        .post-footer {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: auto;
        }
        .post-meta { 
          color: var(--muted); 
          font-size: 13px;
          font-weight: 600;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .post-meta::before {
          content: '📅';
          font-size: 12px;
        }
        .read-more {
          color: var(--brand);
          font-weight: 600;
          font-size: 14px;
          text-decoration: none;
        }
        .read-more:hover {
          text-decoration: underline;
        }
        
        .loading, .error, .empty { 
          text-align: center; 
          padding: 80px 20px;
          grid-column: 1 / -1;
        }
        .error { color: #c00; }
        .empty { color: var(--muted); }
        
        .load-more-wrap {
          text-align: center;
          margin: 40px 0;
        }
        .btn-load-more {
          background: var(--brand);
          color: white;
          border: none;
          padding: 12px 28px;
          border-radius: 12px;
          font-weight: 700;
          font-size: 15px;
          cursor: pointer;
          transition: all 0.3s;
        }
        .btn-load-more:hover {
          background: var(--brand-dark);
          transform: translateY(-2px);
        }
        .btn-load-more:disabled {
          opacity: 0.6;
          cursor: not-allowed;
        }
        
        footer {
          text-align: center;
          padding: 40px 0 20px;
          margin-top: 60px;
          border-top: 1px solid #eee;
          color: var(--muted);
          font-size: 14px;
        }
        footer a {
          color: var(--brand);
          text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }
        
        @media (max-width: 640px) {
          h1 { font-size: 2rem; }
          .blog-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <div class="breadcrumb">
            <a href="/">Home</a> / <span>Blog</span>
        </div>
        
        <div class="header">
            <h1>Blog OtoPadang</h1>
            <p class="subtitle">Tips, review, dan info dunia otomotif terpercaya biar gak ketipu dealer nakal</p>
            <a href="/" class="back-link">← Kembali ke Home</a>
        </div>
        
        <div id="blog-sanity" class="blog-grid">
            <div class="loading">Loading artikel...</div>
        </div>
        
        <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
            <button class="btn-load-more" id="load-more-btn">Muat Artikel Lainnya</button>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 <a href="/">OtoPadang</a>. Jual Beli Mobil Bekas Terpercaya di Padang.</p>
        <p><a href="/sitemap.xml">Sitemap</a> · <a href="/blog">Blog</a> · <a href="/kontak">Kontak</a></p>
    </footer>

    <!-- SCHEMA ITEMLIST DINAMIS -->
    <script type="application/ld+json" id="itemlist-schema"></script>

    <script>
    const PROJECT_ID = 'uzbsymrd';
    const DATASET = 'production';
    const POSTS_PER_PAGE = 9;
    let lastId = null;
    let allPosts = [];
    
    async function loadBlog(loadMore = false) {
      const btn = document.getElementById('load-more-btn');
      if (loadMore) btn.disabled = true;
      
      // QUERY DENGAN PAGINATION
      const filter = `*[_type == "post" && !(_id in path("drafts.**"))${lastId ? ` && _id > "${lastId}"` : ''}]`;
      const QUERY = encodeURIComponent(`${filter} | order(_id) [0...${POSTS_PER_PAGE}]{
        _id,
        title,
        excerpt,
        slug,
        date,
        coverImage
      }`);
      
      const URL = `https://${PROJECT_ID}.apicdn.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;
      
      try {
        const res = await fetch(URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const { result } = await res.json();
        
        if(!result || result.length === 0) {
            if (!loadMore) {
              document.getElementById('blog-sanity').innerHTML = '<div class="empty">Belum ada artikel yg dipublish. Publish dulu di Sanity Studio.</div>';
            }
            document.getElementById('load-more-wrap').style.display = 'none';
            return;
        }
        
        allPosts = loadMore ? [...allPosts, ...result] : result;
        lastId = result[result.length - 1]._id;
        
        // RENDER POST
        const postsHTML = allPosts.map(post => {
            const imgField = post.coverImage;
            let imageUrl = null;
            if (imgField?.asset?._ref) {
              const ref = imgField.asset._ref;
              const [, id, dimension, format] = ref.split('-');
              imageUrl = `https://cdn.sanity.io/images/${PROJECT_ID}/${DATASET}/${id}-${dimension}.${format}`;
            }
            
            const img = imageUrl 
              ? `<a href="post.html?slug=${post.slug?.current}"><img class="post-thumb" src="${imageUrl}?w=600&h=400&fit=crop&auto=format&q=80" alt="${post.title}" loading="lazy"></a>` 
              : `<a href="post.html?slug=${post.slug?.current}"><div class="post-thumb" style="background:#e0e0e0"></div></a>`;
            
            const tgl = post.date 
              ? new Date(post.date).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})
              : '';

            const excerptHTML = post.excerpt ? `<p class="post-excerpt">${post.excerpt}</p>` : '';
            
            return `
              <article class="post">
                ${img}
                <div class="post-body">
                  <h2><a href="post.html?slug=${post.slug?.current}">${post.title}</a></h2>
                  ${excerptHTML}
                  <div class="post-footer">
                    <p class="post-meta">${tgl}</p>
                    <a href="post.html?slug=${post.slug?.current}" class="read-more">Baca →</a>
                  </div>
                </div>
              </article>
            `;
        }).join('');
        
        document.getElementById('blog-sanity').innerHTML = postsHTML;
        
        // TAMPILIN TOMBOL LOAD MORE KALO MASIH ADA DATA
        if (result.length === POSTS_PER_PAGE) {
          document.getElementById('load-more-wrap').style.display = 'block';
          btn.disabled = false;
        } else {
          document.getElementById('load-more-wrap').style.display = 'none';
        }
        
        // INJECT ITEMLIST SCHEMA BUAT SEO
        const itemList = {
          "@context": "https://schema.org",
          "@type": "ItemList",
          "itemListElement": allPosts.map((post, index) => ({
            "@type": "ListItem",
            "position": index + 1,
            "url": `https://otopadang.com/post.html?slug=${post.slug?.current}`
          }))
        };
        document.getElementById('itemlist-schema').textContent = JSON.stringify(itemList);
        
      } catch (e) {
        console.error(e);
        if (!loadMore) {
          document.getElementById('blog-sanity').innerHTML = `<div class="error">Gagal load artikel.<br>Error: ${e.message}</div>`;
        }
        if (btn) btn.disabled = false;
      }
    }
    
    document.getElementById('load-more-btn')?.addEventListener('click', () => loadBlog(true));
    loadBlog();
    </script>
</body>
</html>
