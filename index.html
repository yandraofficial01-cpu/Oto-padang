async function ambilDataSheet(gid) {
  const url = `${BASE_JSON}&gid=${gid}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const json = JSON.parse(text.substr(47).slice(0, -2));
  const headers = json.table.cols.map(c => c.label? c.label.toLowerCase().replace(/\s/g,'').trim() : '');

  return json.table.rows.map(r => {
    let obj = {};
    headers.forEach((h,i) => {
      if(h) {
        let val = r.c[i] && r.c[i].v!= null? r.c[i].v : '';
        obj[h] = val.toString().trim();
      }
    });
    return obj;
  });
}

function fixImgurUrl(url) {
  if(!url) return '';
  url = url.trim();
  if(url.includes('drive.google.com')) {
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(match && match[1]) {
      return `https://drive.google.com/uc?export=view&id=${match[1]}`;
    }
  }
  if(url.includes('imgur.com/') &&!url.includes('i.imgur.com')) {
    const id = url.split('/').pop().split('.')[0];
    return `https://i.imgur.com/${id}.jpg`;
  }
  return url;
}

function getAllImages(mobil) {
  const urls = [];
  for(let i = 1; i <= 6; i++) {
    const key = `foto_${i}`;
    const raw = mobil[key];
    if(raw && typeof raw === 'string' && raw.trim().length > 10 && raw.trim().toLowerCase().startsWith('http')) {
      urls.push(fixImgurUrl(raw.trim()));
    }
  }
  return urls.length? urls : ['https://via.placeholder.com/400x240/1c1c1e/666?text=No+Image'];
}

function fixNomorWA(nomor) {
  if(!nomor) return '';
  let wa = nomor.toString().replace(/[^0-9]/g, '');
  if(wa.startsWith('0')) wa = '62' + wa.substring(1);
  if(wa.startsWith('8')) wa = '62' + wa;
  if(!wa.startsWith('62')) wa = '62' + wa;
  return wa;

  const filterHarga = document.getElementById('filterHarga').value;

  const filterTransmisi = document.getElementById('filterTransmisi').value;

  const [minHarga, maxHarga] = filterHarga ? filterHarga.split('-').map(Number) : [0, Infinity];
  const [minTahun, maxTahun] = filterTahun ? filterTahun.split('-').map(Number) : [0, Infinity];

  const hasilFilter = semuaMobilGlobal.filter(mobil => {
    // INI DIA FIX-NYA: PAKE harga_cash BUKAN harga

    const tahunMobil = Number(mobil.tahun) || 0;
    
    const namaMatch = !keyword || String(mobil.merk || '').toLowerCase().includes(keyword) || 
                      String(mobil.tipe || '').toLowerCase().includes(keyword);
    const hargaMatch = hargaMobil >= minHarga && hargaMobil <= maxHarga;
    const tahunMatch = tahunMobil >= minTahun && tahunMobil <= maxTahun;
    const transmisiMatch = !filterTransmisi || mobil.transmisi === filterTransmisi;
    
    return namaMatch && hargaMatch && tahunMatch && transmisiMatch;
  });

function removeBrokenSlide(sliderId, imgEl) {
  const slider = document.getElementById(sliderId);
  if(!slider) return;
  const slides = slider.querySelector('.slides');
  const dotsContainer = slider.querySelector('.dots');
  const imgIdx = Array.from(slides.children).indexOf(imgEl);
  imgEl.remove();
  if(dotsContainer && dotsContainer.children[imgIdx]) {
    dotsContainer.children[imgIdx].remove();
  }
  let current = parseInt(slider.dataset.current || 0);
  const newTotal = slides.children.length;
  if(newTotal === 0) {
    slides.innerHTML = `<img src="https://via.placeholder.com/400x240/1c1c1e/666?text=No+Image">`;
    slider.querySelector('.slider-btn.prev')?.remove();
    slider.querySelector('.slider-btn.next')?.remove();
    dotsContainer?.remove();
    return;
  }
  if(current >= newTotal) {
    current = newTotal - 1;
    slider.dataset.current = current;
    slides.style.transform = `translateX(-${current * 100}%)`;
  }
  dotsContainer?.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === current));
  if(newTotal <= 1) {
    slider.querySelector('.slider-btn.prev')?.remove();
    slider.querySelector('.slider-btn.next')?.remove();
    dotsContainer?.remove();
  }
}

function slide(sliderId, dir, e) {
  if(e) { e.stopPropagation(); e.preventDefault(); }
  const slider = document.getElementById(sliderId);
  const slides = slider.querySelector('.slides');
  const dots = slider.querySelectorAll('.dot');
  const total = slides.children.length;
  let current = parseInt(slider.dataset.current || 0);
  let newCurrent = current + dir;
  if(dir > 0) newCurrent = Math.min(current + 1, total - 1);
  if(dir < 0) newCurrent = Math.max(current - 1, 0);
  if(newCurrent === current) return;
  slides.style.transform = `translateX(-${newCurrent * 100}%)`;
  slider.dataset.current = newCurrent;
  dots.forEach((d,i) => d.classList.toggle('active', i === newCurrent));
}

function goSlide(sliderId, idx, e) {
  if(e) { e.stopPropagation(); e.preventDefault(); }
  const slider = document.getElementById(sliderId);
  const slides = slider.querySelector('.slides');
  const dots = slider.querySelectorAll('.dot');
  const total = slides.children.length;
  idx = Math.max(0, Math.min(idx, total - 1));
  slides.style.transform = `translateX(-${idx * 100}%)`;
  slider.dataset.current = idx;
  dots.forEach((d,i) => d.classList.toggle('active', i === idx));
}

function initSwipeSlider() {
  document.querySelectorAll('.slider').forEach(slider => {
    const slides = slider.querySelector('.slides');
    if(slides.children.length <= 1) return;
    let startX = 0, startY = 0, currentX = 0, isDragging = false, isScrolling = null, startTime = 0;
    const start = e => {
      if(e.touches && e.touches.length > 1) return;
      startX = e.touches? e.touches[0].clientX : e.clientX;
      startY = e.touches? e.touches[0].clientY : e.clientY;
      startTime = Date.now();
      isDragging = true;
      isScrolling = null;
      slides.classList.add('dragging');
    };
    const move = e => {
      if(!isDragging) return;
      currentX = e.touches? e.touches[0].clientX : e.clientX;
      const currentY = e.touches? e.touches[0].clientY : e.clientY;
      const diffX = currentX - startX;
      const diffY = currentY - startY;
      if(isScrolling === null) isScrolling = Math.abs(diffX) < Math.abs(diffY);
      if(isScrolling) return;
      e.preventDefault();
      const current = parseInt(slider.dataset.current || 0);
      const offset = -current * 100 + (diffX / slider.offsetWidth) * 100;
      slides.style.transform = `translateX(${offset}%)`;
    };
    const end = e => {
      if(!isDragging) return;
      isDragging = false;
      slides.classList.remove('dragging');
      if(isScrolling) return;
      const diff = currentX - startX;
      const elapsed = Date.now() - startTime;
      const velocity = Math.abs(diff) / elapsed;
      const threshold = velocity > 0.5? 30 : 80;
      if(Math.abs(diff) > threshold) {
        if(diff > 0) slide(slider.id, -1);
        else slide(slider.id, 1);
      } else {
        const current = parseInt(slider.dataset.current || 0);
        slides.style.transform = `translateX(-${current * 100}%)`;
      }
    };
    slider.addEventListener('touchstart', start, {passive: true});
    slider.addEventListener('touchmove', move, {passive: false});
    slider.addEventListener('touchend', end);
    slider.addEventListener('mousedown', start);
    slider.addEventListener('mousemove', move);
    slider.addEventListener('mouseup', end);
    slider.addEventListener('mouseleave', end);
  });
}

let zoomState = {scale: 1, lastScale: 1, posX: 0, posY: 0, lastPosX: 0, lastPosY: 0, lastTap: 0};

function initZoomPan() {
  const img = document.getElementById('lightboxImg');
  zoomState = {scale: 1, lastScale: 1, posX: 0, posY: 0, lastPosX: 0, lastPosY: 0, lastTap: 0};
  let startDistance = 0, startX = 0, startY = 0;
  img.ontouchend = e => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - zoomState.lastTap;
    if(tapLength < 300 && tapLength > 0 && e.touches.length === 0) {
      e.preventDefault();
      e.stopPropagation();
      if(zoomState.scale === 1) {
        zoomState.scale = 2.5;
        zoomState.lastScale = 2.5;
      } else {
        zoomState.scale = 1;
        zoomState.lastScale = 1;
        zoomState.posX = 0; zoomState.posY = 0; zoomState.lastPosX = 0; zoomState.lastPosY = 0;
      }
      img.style.transform = `scale(${zoomState.scale}) translate(${zoomState.posX}px, ${zoomState.posY}px)`;
    }
    zoomState.lastTap = currentTime;
    if(e.touches.length < 2) {
      zoomState.lastScale = zoomState.scale;
      zoomState.lastPosX = zoomState.posX;
      zoomState.lastPosY = zoomState.posY;
    }
  };
  img.ontouchstart = e => {
    if(e.touches.length === 2) {
      startDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    } else if(e.touches.length === 1 && zoomState.scale > 1) {
      startX = e.touches[0].pageX - zoomState.lastPosX;
      startY = e.touches[0].pageY - zoomState.lastPosY;
    }
  };
  img.ontouchmove = e => {
    if(e.touches.length === 2) {
      e.preventDefault();
      const distance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
      zoomState.scale = zoomState.lastScale * (distance / startDistance);
      zoomState.scale = Math.min(Math.max(1, zoomState.scale), 4);
      if(zoomState.scale === 1) {
        zoomState.posX = 0; zoomState.posY = 0; zoomState.lastPosX = 0; zoomState.lastPosY = 0;
      }
      img.style.transform = `scale(${zoomState.scale}) translate(${zoomState.posX}px, ${zoomState.posY}px)`;
    } else if(e.touches.length === 1 && zoomState.scale > 1) {
      e.preventDefault();
      zoomState.posX = e.touches[0].pageX - startX;
      zoomState.posY = e.touches[0].pageY - startY;
      img.style.transform = `scale(${zoomState.scale}) translate(${zoomState.posX}px, ${zoomState.posY}px)`;
    }
  };
}

function toggleTheme() {
  const body = document.body;
  const btn = document.getElementById('themeBtn');
  const newTheme = body.getAttribute('data-theme') === 'dark'? 'light' : 'dark';
  body.setAttribute('data-theme', newTheme);
  btn.textContent = newTheme === 'dark'? '☀️' : '🌙';
  localStorage.setItem('theme', newTheme);
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({'event': 'toggle_theme', 'theme': newTheme});
}

function loadTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.body.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark'? '☀️' : '🌙';
}

init();
</script>
</body>
