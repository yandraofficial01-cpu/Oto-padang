  <style>
    :root{
      --bg:#0a0a0a; --card:#1c1c1e; --text:#fff; --text2:#888; --border:#2c2c2e;
      --primary:#007aff; --green:#30d158; --hot:#ff3b30; --wa:#25D366;

      --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --text2:#6e6e73; --border:#d2d2d7;

.banner-text h1{font-size:28px;font-weight:800;color:#fff;margin-bottom:4px}
.banner-text p{color:rgba(255,255,255,.8);font-size:14px}

.header-actions{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:16px}
.search::placeholder{color:var(--text2)}
.theme-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;font-size:20px;color:var(--text)}

/* DROPDOWN */
.dropdown{position:relative}
.dropdown-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.dropdown-btn:hover{background:var(--border)}
.dropdown-menu{position:absolute;top:50px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:220px;display:none;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:300px;overflow-y:auto}
.dropdown-menu.show{display:block}
.dropdown-menu a{display:block;width:100%;text-align:left;padding:12px 16px;color:var(--text);text-decoration:none;font-weight:600}
.dropdown-menu a:hover{background:var(--bg)}
.dropdown-menu.empty{padding:12px 16px;color:var(--text2);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--border);transform:translateY(0);transition:all.3s;animation:fadeIn.5s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.slider{position:relative;width:100%;height:240px;background:#000;overflow:hidden;touch-action:pan-y}
.slides{display:flex;height:100%;transition:transform.4s ease;will-change:transform}
.slides img{width:100%;height:100%;object-fit:cover;flex-shrink:0;user-select:none;-webkit-user-drag:none;cursor:pointer}
.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;backdrop-filter:blur(5px);z-index:2}
.slider-btn:hover{background:rgba(0,0,0,.8)}
.prev{left:12px}.next{right:12px}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}

.card-body{padding:20px}

.card h3{font-size:22px;margin-bottom:8px}
.harga{color:var(--green);font-weight:800;font-size:26px;margin:12px 0}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:var(--text2);margin:16px 0}
.spec span{background:var(--bg);padding:8px 12px;border-radius:10px}

.btn-group{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}

.loading,.no-result{text-align:center;padding:40px;color:var(--text2);grid-column:1/-1}

.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;display:none;align-items:center;justify-content:center}

.lightbox-img{max-width:90%;max-height:90%;object-fit:contain;transition:transform.2s;touch-action:none}
.lightbox-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;backdrop-filter:blur(10px)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);color:#fff;border:none;width:50px;height:50px;border-radius:50%;font-size:28px;cursor:pointer;backdrop-filter:blur(10px)}
.lightbox-prev{left:20px}.lightbox-next{right:20px}
.lightbox-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:20px;font-size:14px}

.share-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:10000;display:none;align-items:flex-end;justify-content:center}

.share-title{font-size:18px;font-weight:700;margin-bottom:20px;text-align:center}

.share-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--text)}
.share-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
.share-icon.wa{background:var(--wa)}
.share-icon.fb{background:var(--fb)}

.share-icon.tt{background:var(--tiktok)}

.share-icon.copy{background:var(--border);color:var(--text)}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);color:var(--text);padding:14px 24px;border-radius:12px;border:1px solid var(--border);font-weight:600;z-index:10001;opacity:0;transition:all.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  </style>

<body data-theme="dark">

      <h1>OTO PADANG</h1>

    <input type="text" class="search" id="search" placeholder="🔍 Cari Avanza, 2019, Manual..." oninput="filterData()">

    <!-- DROPDOWN DAFTAR SHOWROOM BUAT PEMBELI -->

      <button class="dropdown-btn" onclick="toggleDropdown('daftarShowroomMenu')">🏪 Daftar Showroom ▼</button>

      <button class="dropdown-btn" onclick="toggleDropdown('showroomMenu')">🔐 Login Showroom ▼</button>

        <a href="login.html">🔐 Login Showroom</a>

  <div class="toast" id="toast">Link berhasil disalin!</div>

<script>
const SHEET_ID = '1YpsM_hGM3RlzMVG7x-dIVe6BCA9STCfo5RlYX7mt7Rg';
const BASE_JSON = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
let semuaMobilGlobal = [];
let semuaShowroomGlobal = [];
let currentLightboxImages = [];
let currentLightboxIndex = 0;

// DROPDOWN TOGGLE
function toggleDropdown(id){
  document.querySelectorAll('.dropdown-menu').forEach(m => {
    if(m.id!== id) m.classList.remove('show');
  });
  document.getElementById(id).classList.toggle('show');
}

// TUTUP DROPDOWN KLIK LUAR
window.onclick = function(e) {
  if (!e.target.matches('.dropdown-btn')) {
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  }
}

async function ambilDataSheet(gid) {
  const url = `${BASE_JSON}&gid=${gid}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const json = JSON.parse(text.substr(47).slice(0, -2));
  const headers = json.table.cols.map(c => c.label? c.label.toLowerCase().replace(/\s/g,'').trim() : '');

  return json.table.rows.map(r => {
    let obj = {};
    headers.forEach((h,i) => {
      if(h) {
        let val = r.c[i] && r.c[i].v!= null? r.c[i].v : '';
        obj[h] = val.toString().trim();
      }
    });
    return obj;
  });
}

function getAllImages(mobil) {
  const urls = [];
  for(let i = 1; i <= 6; i++) {
    const key = i === 1? 'gambar_url' : `gambar_url_${i}`;
    if(mobil[key]) urls.push(fixImgurUrl(mobil[key]));
  }
  return urls.length? urls : ['https://via.placeholder.com/400x240/1c1c1e/666?text=OTO+PADANG'];
}

function fixImgurUrl(url) {
  if(!url) return '';
  if(url.includes('imgur.com/') &&!url.includes('i.imgur.com')) {
    const id = url.split('/').pop().split('.')[0];
    return `https://i.imgur.com/${id}.jpg`;
  }
  return url;
}

async function init() {
  try {
    semuaShowroomGlobal = (await ambilDataSheet('72239375')).filter(s => s.nama_showroom);

    const promisesMobil = semuaShowroomGlobal.filter(s => {
      return s.sheet_gid!== undefined && s.sheet_gid!== null && s.sheet_gid.toString().trim()!== '';
    }).map(async (showroom) => {
      const gid = showroom.sheet_gid.toString().trim();
      const mobil = await ambilDataSheet(gid);
      return mobil.filter(m => m.id).map(m => ({...m,...showroom}));
    });

    const semuaData = await Promise.all(promisesMobil);

    semuaMobilGlobal = semuaData.flat().filter(m => {
      const status = m.status? m.status.toString().toUpperCase().trim() : '';
      return status === 'READY';
    });

    renderDaftarShowroom(semuaShowroomGlobal);
    renderMobil(semuaMobilGlobal);
    loadTheme();
  } catch(e) {
    console.error('ERROR:', e);
    document.getElementById('list-mobil').innerHTML = `<div class="loading" style="color:#ff3b30">Error: ${e.message}<br>Pastikan Sheet di-share "Anyone with the link"</div>`;
  }
}

// RENDER DROPDOWN DAFTAR SHOWROOM BUAT PEMBELI
function renderDaftarShowroom(showroomList) {
  const div = document.getElementById('daftarShowroomMenu');
  const showroomAdaDomain = showroomList.filter(s => s.domain_showroom);

  if(showroomAdaDomain.length === 0){
    div.innerHTML = `<div class="empty">Belum ada showroom</div>`;
    return;
  }

  div.innerHTML = showroomAdaDomain.map(s =>
    `<a href="${s.domain_showroom}" target="_blank">🏪 ${s.nama_showroom}</a>`
  ).join('');
}

function filterData() {
  const keyword = document.getElementById('search').value.toLowerCase();
  let data = semuaMobilGlobal;

  if(keyword) data = data.filter(m =>
    `${m.merk} ${m.tipenya} ${m.tahun}`.toLowerCase().includes(keyword) ||
    (m.transmisi || '').toLowerCase().includes(keyword) ||
    (m.deskripsi || '').toLowerCase().includes(keyword) ||
    (m.nama_showroom || '').toLowerCase().includes(keyword)
  );

  renderMobil(data);
}

function renderMobil(data) {
  const div = document.getElementById('list-mobil');
  if(data.length === 0) return div.innerHTML = '<div class="no-result">Mobil tidak ditemukan 🔍<br>Cek Console F12. Pastikan kolom status = READY</div>';

  div.innerHTML = data.map((m, idx) => {
    const images = getAllImages(m);
    const sliderId = `slider-${m.id}-${idx}`;
    const imgData = JSON.stringify(images).replace(/"/g, '&quot;');
    const shareData = {
      id: m.id,
      title: `${m.merk} ${m.tipenya} ${m.tahun}`,
      harga: `Rp ${Number(m.harga_jual || 0).toLocaleString('id-ID')}`,
      showroom: m.nama_showroom,
      wa: m.wa_admin,
      img: images[0]
    };

    const btnKeShowroom = m.domain_showroom? `
      <a href="${m.domain_showroom}" target="_blank" class="showroom-btn">
        🏪 Kunjungi ${m.nama_showroom}
      </a>
    ` : '';

    return `
    <div class="card">
      <div class="slider" id="${sliderId}" data-current="0">
        <div class="slides">
          ${images.map((img,i) => `<img src="${img}" loading="lazy" onclick='openLightbox(${imgData}, ${i})' onerror="this.src='https://via.placeholder.com/400x240/ff3b30/fff?text=ERROR'">`).join('')}
        </div>
        ${images.length > 1? `
          <button class="slider-btn prev" onclick="slide('${sliderId}', -1)">‹</button>
          <button class="slider-btn next" onclick="slide('${sliderId}', 1)">›</button>
          <div class="dots">
            ${images.map((_,i) => `<span class="dot ${i===0?'active':''}" onclick="goSlide('${sliderId}', ${i})"></span>`).join('')}
          </div>
        ` : ''}
      </div>
      <div class="card-body">
        <div class="badge ${m.hot === 'YA'? 'hot' : ''}">
          ${m.hot === 'YA'? '🔥' : '🏪'} ${m.nama_showroom} ${m.hot === 'YA'? 'HOT' : ''}
        </div>
        <h3>${m.merk} ${m.tipenya} ${m.tahun}</h3>
        <div class="harga">Rp ${Number(m.harga_jual || 0).toLocaleString('id-ID')}</div>
        <div class="spec">
          <span>⚙️ ${m.transmisi}</span><span>⛽ ${m.bahan_bakar}</span>
          <span>🎨 ${m.warna}</span><span>🛣️ ${Number(m.km || 0).toLocaleString('id-ID')} KM</span>
        </div>
        <p class="desc">${m.deskripsi || ''}</p>
        <div class="btn-group">
          <a href="https://wa.me/${m.wa_admin}?text=Halo ${m.nama_showroom}, saya minat ${m.merk} ${m.tipenya} ${m.tahun} kode:${m.id}" class="wa-btn" target="_blank">💬 Chat WA ${m.nama_showroom}</a>
          <button class="share-btn" onclick='openShareModal(${JSON.stringify(shareData).replace(/"/g, '&quot;')})'>📤</button>
        </div>
        ${btnKeShowroom}
      </div>
    </div>
  `}).join('');

  initSwipeSlider();
}

function openShareModal(data) {
  const modal = document.getElementById('shareModal');
  const grid = document.getElementById('shareGrid');
  const text = `${data.title} - ${data.harga} | ${data.showroom}`;
  const waLink = `https://wa.me/${data.wa}?text=Halo ${data.showroom}, saya minat ${data.title} kode:${data.id}`;
  const encodedText = encodeURIComponent(text);
  const encodedUrl = encodeURIComponent(waLink);

  grid.innerHTML = `
    <a href="https://wa.me/?text=${encodedText}%0A${encodedUrl}" target="_blank" class="share-item">
      <div class="share-icon wa">💬</div>
      <div class="share-label">WhatsApp</div>
    </a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}" target="_blank" class="share-item">
      <div class="share-icon fb">f</div>
      <div class="share-label">Facebook</div>
    </a>
    <a href="https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}" target="_blank" class="share-item">
      <div class="share-icon tw">𝕏</div>
      <div class="share-label">Twitter</div>
    </a>
    <a href="instagram://library?AssetPath=${encodeURIComponent(data.img)}" onclick="copyForIG('${waLink}');return false;" class="share-item">
      <div class="share-icon ig">📷</div>
      <div class="share-label">Instagram</div>
    </a>
    <a href="https://www.tiktok.com" onclick="copyForTT('${waLink}');return false;" class="share-item">
      <div class="share-icon tt">♪</div>
      <div class="share-label">TikTok</div>
    </a>
    <a href="#" onclick="copyLink('${waLink}');return false;" class="share-item">
      <div class="share-icon copy">🔗</div>
      <div class="share-label">Copy Link</div>
    </a>
  `;

  modal.classList.add('active');
}

function closeShareModal(e) {
  if(!e || e.target.id === 'shareModal' || e.target.className === 'share-close') {
    document.getElementById('shareModal').classList.remove('active');
  }
}

function copyForIG(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link disalin! Paste di IG Story');
    closeShareModal();
  });
}

function copyForTT(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link disalin! Paste di TikTok');
    closeShareModal();
  });
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link berhasil disalin!');
    closeShareModal();
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function slide(sliderId, dir) {
  const slider = document.getElementById(sliderId);
  const slides = slider.querySelector('.slides');
  const dots = slider.querySelectorAll('.dot');
  const total = slides.children.length;
  let current = parseInt(slider.dataset.current || 0);

  current = (current + dir + total) % total;
  slides.style.transform = `translateX(-${current * 100}%)`;
  slider.dataset.current = current;

  dots.forEach((d,i) => d.classList.toggle('active', i === current));
}

function goSlide(sliderId, idx) {
  const slider = document.getElementById(sliderId);
  const slides = slider.querySelector('.slides');
  const dots = slider.querySelectorAll('.dot');

  slides.style.transform = `translateX(-${idx * 100}%)`;
  slider.dataset.current = idx;
  dots.forEach((d,i) => d.classList.toggle('active', i === idx));
}

function initSwipeSlider() {
  document.querySelectorAll('.slider').forEach(slider => {
    const slides = slider.querySelector('.slides');
    if(slides.children.length <= 1) return;

    let startX = 0, currentX = 0, isDragging = false;

    const start = e => {
      startX = e.touches? e.touches[0].clientX : e.clientX;
      isDragging = true;
      slides.style.transition = 'none';
    };

    const move = e => {
      if(!isDragging) return;
      currentX = e.touches? e.touches[0].clientX : e.clientX;
      const diff = currentX - startX;
      const current = parseInt(slider.dataset.current || 0);
      const offset = -current * 100 + (diff / slider.offsetWidth) * 100;
      slides.style.transform = `translateX(${offset}%)`;
    };

    const end = e => {
      if(!isDragging) return;
      isDragging = false;
      slides.style.transition = 'transform.4s ease';

      const diff = currentX - startX;
      if(Math.abs(diff) > 50) {
        if(diff > 0) slide(slider.id, -1);
        else slide(slider.id, 1);
      } else {
        const current = parseInt(slider.dataset.current || 0);
        slides.style.transform = `translateX(-${current * 100}%)`;
      }
    };

    slider.addEventListener('touchstart', start, {passive: true});
    slider.addEventListener('touchmove', move, {passive: true});
    slider.addEventListener('touchend', end);
    slider.addEventListener('mousedown', start);
    slider.addEventListener('mousemove', move);
    slider.addEventListener('mouseup', end);
    slider.addEventListener('mouseleave', end);
  });
}

function openLightbox(images, index) {
  currentLightboxImages = images;
  currentLightboxIndex = index;
  const lightbox = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = images[index];
  img.style.transform = 'scale(1)';
  lightbox.classList.add('active');
  updateLightboxCounter();
  initPinchZoom();
}

function closeLightbox(e) {
  if(e.target.id === 'lightbox' || e.target.className === 'lightbox-close') {
    document.getElementById('lightbox').classList.remove('active');
  }
}

function lightboxSlide(dir, e) {
  e.stopPropagation();
  currentLightboxIndex = (currentLightboxIndex + dir + currentLightboxImages.length) % currentLightboxImages.length;
  const img = document.getElementById('lightboxImg');
  img.src = currentLightboxImages[currentLightboxIndex];
  img.style.transform = 'scale(1)';
  updateLightboxCounter();
}

function updateLightboxCounter() {
  document.getElementById('lightboxCounter').textContent = `${currentLightboxIndex + 1} / ${currentLightboxImages.length}`;
}

function initPinchZoom() {
  const img = document.getElementById('lightboxImg');
  let scale = 1, startDistance = 0, lastScale = 1;

  img.addEventListener('touchstart', e => {
    if(e.touches.length === 2) {
      startDistance = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
    }
  });

  img.addEventListener('touchmove', e => {
    if(e.touches.length === 2) {
      e.preventDefault();
      const distance = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      scale = lastScale * (distance / startDistance);
      scale = Math.min(Math.max(1, scale), 4);
      img.style.transform = `scale(${scale})`;
    }
  });

  img.addEventListener('touchend', e => {
    if(e.touches.length < 2) lastScale = scale;
  });
}

function toggleTheme() {
  const body = document.body;
  const btn = document.getElementById('themeBtn');
  const newTheme = body.getAttribute('data-theme') === 'dark'? 'light' : 'dark';
  body.setAttribute('data-theme', newTheme);
  btn.textContent = newTheme === 'dark'? '☀️' : '🌙';
  localStorage.setItem('theme', newTheme);
}

function loadTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.body.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark'? '☀️' : '🌙';
}
