<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Showroom - OTO PADANG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1877f2 0%, #0a5dc9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
.box {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
  .logo { font-size: 32px; margin-bottom: 5px; }
  .welcome { color: #1877f2; font-size: 18px; font-weight: 600; margin: 0 0 5px 0; }
  .subtitle { color: #666; font-size: 14px; margin: 0 0 25px 0; }
    h2 { color: #1c1e21; margin: 0 0 20px 0; font-size: 22px; }
    input {
      width: 100%; padding: 14px; margin: 10px 0;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; transition: border 0.3s;
    }
    input:focus { outline: none; border: 1px solid #1877f2; }
    button {
      width: 100%; padding: 14px; background: #1877f2;
      color: white; border: none; border-radius: 8px;
      font-weight: bold; font-size: 16px; margin-top: 15px;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover { background: #0d65d9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; height: 20px; }
   .error { color: red; }
   .sukses { color: green; }
  .footer { margin-top: 25px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🚗</div>
    <p class="welcome">Welcome Partner</p>
    <p class="subtitle">OTO PADANG</p>

    <h2>Login Showroom</h2>
    <input type="email" id="email" placeholder="Email" value="admin@putraoto.com">
    <input type="password" id="password" placeholder="Password" value="123456">
    <button id="btnLogin" onclick="login()">Masuk</button>
    <p id="status"></p>

    <div class="footer">© 2026 OTO PADANG - Portal Mitra</div>
  </div>

  <script>
    // DATABASE SHOWROOM - INI HARUS SAMA DENGAN slug_showroom DI SHEET PAKET_SHOWROOM
    const DATA_SHOWROOM = {
      "admin@putraoto.com": {
        id: "putra-oto-solok", // PENTING: ini yg dikirim ke GAS
        nama: "Putra Oto Solok",
        email: "admin@putraoto.com",
        lokasi: "Solok, Sumbar",
        pass: "123456"
      },
      "jaya@motor.com": {
        id: "jaya-motor",
        nama: "Jaya Motor",
        email: "jaya@motor.com",
        lokasi: "Padang Barat",
        pass: "123456"
      }
    };

    // Kalo udah login, langsung lempar ke form
    if (localStorage.getItem('showroom')) {
      window.location.href = 'input-mobil.html';
    }

    function login() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btnLogin');

      status.className = '';
      status.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Mengecek...';

      if (!email ||!pass) {
        status.className = 'error';
        status.innerText = 'Email & password wajib diisi';
        btn.disabled = false;
        btn.innerText = 'Masuk';
        return;
      }

      const showroom = DATA_SHOWROOM[email];

      if (!showroom) {
        status.className = 'error';
        status.innerText = 'Email tidak terdaftar';
        btn.disabled = false;
        btn.innerText = 'Masuk';
        return;
      }

      if (showroom.pass!== pass) {
        status.className = 'error';
        status.innerText = 'Password salah';
        btn.disabled = false;
        btn.innerText = 'Masuk';
        return;
      }

      // SUKSES LOGIN - SIMPAN KE LOCALSTORAGE
      localStorage.setItem('showroom', JSON.stringify({
        id: showroom.id, // INI YANG BIKIN GAK ERROR "slug_showroom wajib dikirim"
        nama: showroom.nama,
        email: showroom.email,
        lokasi: showroom.lokasi
      }));

      status.className = 'sukses';
      status.innerText = 'Login berhasil...';
      setTimeout(() => {
        window.location.href = 'input-mobil.html';
      }, 500);
    }

    // Enter = login
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
