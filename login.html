<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Showroom - OTO PADANG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1877f2 0%, #0a5dc9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
   .box {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
   .logo { font-size: 32px; margin-bottom: 5px; }
   .welcome { color: #1877f2; font-size: 18px; font-weight: 600; margin: 0 0 5px 0; }
   .subtitle { color: #666; font-size: 14px; margin: 0 0 25px 0; }
    h2 { color: #1c1e21; margin: 0 0 20px 0; font-size: 22px; }
    input {
      width: 100%; padding: 14px; margin: 10px 0;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; transition: border 0.3s;
    }
    input:focus { outline: none; border: 1px solid #1877f2; }
    button {
      width: 100%; padding: 14px; background: #1877f2;
      color: white; border: none; border-radius: 8px;
      font-weight: bold; font-size: 16px; margin-top: 15px;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover { background: #0d65d9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; height: 20px; }
   .error { color: red; }
   .sukses { color: green; }
   .footer { margin-top: 25px; font-size: 12px; color: #999; }
   .back-link {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
   .back-link a {
      color: #1877f2;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🚗</div>
    <p class="welcome">Welcome Partner</p>
    <p class="subtitle">OTO PADANG</p>

    <h2>Login Showroom</h2>
    <input type="email" id="email" placeholder="Email Showroom">
    <input type="password" id="password" placeholder="Password">
    <button id="btnLogin" onclick="login()">Masuk</button>
    <p id="status"></p>

    <div class="back-link">
      <a href="/">← Kembali ke Beranda Oto Padang</a>
    </div>

    <div class="footer">© 2026 OTO PADANG - Portal Mitra</div>
  </div>

  <script>
    const SHEET_ID = '1YpsM_hGM3RlzMVG7x-dIVe6BCA9STCfo5RlYX7mt7Rg';
    const GID_PARTNER = '490587314'; // GID tab Partner lu
    const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID_PARTNER}`;

    try {
      const showroomData = JSON.parse(localStorage.getItem('showroom') || '{}');
      if (showroomData.id) window.location.href = 'input-mobil.html';
    } catch(e) {
      localStorage.removeItem('showroom');
    }

    async function login() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btnLogin');

      status.className = '';
      status.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Mengecek...';

      if (!email ||!pass) {
        status.className = 'error';
        status.innerText = 'Email & password wajib diisi';
        btn.disabled = false;
        btn.innerText = 'Masuk';
        return;
      }

      try {
        const res = await fetch(API_URL);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const headers = json.table.cols.map(c => c.label? c.label.toLowerCase().replace(/ /g,'_').trim() : '');
        const rows = json.table.rows;

        let showroom = null;
        for (let r of rows) {
          let obj = {};
          headers.forEach((h,i) => {
            if(h) obj[h] = r.c[i] && r.c[i].v!= null? r.c[i].v.toString().trim() : '';
          });
          if (obj.email && obj.email.toLowerCase() === email) {
            showroom = obj;
            break;
          }
        }

        if (!showroom) {
          status.className = 'error';
          status.innerText = 'Email tidak terdaftar';
          btn.disabled = false;
          btn.innerText = 'Masuk';
          return;
        }

        if (showroom.password!== pass) {
          status.className = 'error';
          status.innerText = 'Password salah';
          btn.disabled = false;
          btn.innerText = 'Masuk';
          return;
        }

        // UDAH GUA GANTI JADI AKTIF BRO
        if (showroom.status && showroom.status.toLowerCase()!== 'aktif') {
          status.className = 'error';
          status.innerText = 'Akun belum aktif / suspended';
          btn.disabled = false;
          btn.innerText = 'Masuk';
          return;
        }

        localStorage.setItem('showroom', JSON.stringify({
          id: showroom.slug_showroom,
          nama: showroom.nama_showroom,
          email: showroom.email,
          gid: showroom.sheet_gid,
          domain: showroom.domain_showroom,
          limit: showroom.limit_mobil,
          no_hp: showroom.no_hp_pic
        }));

        status.className = 'sukses';
        status.innerText = 'Login berhasil...';
        setTimeout(() => {
          window.location.href = 'input-mobil.html';
        }, 500);

      } catch(e) {
        console.error(e);
        status.className = 'error';
        status.innerText = 'Gagal konek ke server';
        btn.disabled = false;
        btn.innerText = 'Masuk';
      }
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
