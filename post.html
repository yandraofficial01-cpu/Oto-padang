<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel - OtoPadang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --brand: #0066cc;
          --text: #1a1a1a;
          --muted: #666;
          --bg: #fff;
          --border: #eee;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
          line-height: 1.7;
          color: var(--text);
          background: var(--bg);
          text-align: left;
        }
        
        /* HEADER */
        .site-header {
          border-bottom: 1px solid var(--border);
          padding: 16px;
          background: #fff;
          position: sticky;
          top: 0;
          z-index: 10;
          box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .header-inner {
          max-width: 720px;
          margin: 0 auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .logo {
          font-weight: 700;
          font-size: 20px;
          color: var(--brand);
          text-decoration: none;
        }
        .nav a {
          color: var(--text);
          text-decoration: none;
          font-weight: 600;
          font-size: 15px;
          margin-left: 20px;
        }
        .nav a:hover { color: var(--brand); }
        
        /* KONTEN */
        .container {
          max-width: 720px; 
          margin: 0 auto; 
          padding: 40px 16px;
        }
        h1 { 
          font-size: 2.25rem; 
          line-height: 1.2; 
          margin-bottom: 12px;
          font-weight: 700;
          text-align: left;
        }
        .meta { 
          color: var(--muted); 
          font-size: 14px; 
          margin-bottom: 32px;
          text-align: left;
        }
        img { 
          width: 100%; 
          border-radius: 12px; 
          margin: 32px 0;
          box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .content { text-align: left; }
        .content p { 
          margin-bottom: 24px; 
          font-size: 17px;
          text-align: left;
        }
        /* FIX JARAK SUB JUDUL */
        .content h2, .content h3 { 
          margin-top: 48px;
          margin-bottom: 16px;
          font-weight: 700;
          text-align: left;
          line-height: 1.3;
        }
        .content h2 { font-size: 1.75rem; }
        .content h3 { font-size: 1.4rem; }
        .content h3 + p { margin-top: 0; }
        
        .content ul, .content ol { 
          padding-left: 24px; 
          margin-bottom: 24px;
          text-align: left;
        }
        .content li { 
          margin-bottom: 12px;
          font-size: 17px;
          text-align: left;
        }
        .content strong {
          font-weight: 600;
          color: #000;
        }
        .content a {
          color: var(--brand);
          font-weight: 600;
          text-decoration: none;
        }
        .content a:hover { text-decoration: underline; }
        .back-link {
          color: var(--brand);
          text-decoration: none;
          font-weight: 600;
          font-size: 15px;
          display: inline-block;
          margin-bottom: 24px;
        }
        .back-link:hover { text-decoration: underline; }
        .loading, .error { text-align: center; padding: 80px 20px; color: var(--muted); }
        .error { color: #c00; }
        
        /* FOOTER */
        .site-footer {
          border-top: 1px solid var(--border);
          padding: 32px 16px;
          margin-top: 60px;
          background: #fafafa;
        }
        .footer-inner {
          max-width: 720px;
          margin: 0 auto;
          text-align: center;
          color: var(--muted);
          font-size: 14px;
        }
        .footer-inner a {
          color: var(--brand);
          text-decoration: none;
          font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="logo">OtoPadang</a>
        <nav class="nav">
          <a href="/blog.html">Blog</a>
          <a href="https://otopadang.com">Jual Mobil</a>
        </nav>
      </div>
    </header>

    <!-- KONTEN -->
    <main class="container">
      <a href="/blog.html" class="back-link">← Kembali ke Blog</a>
      <div id="post-content" class="loading">Loading artikel...</div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 <a href="https://otopadang.com">OtoPadang.com</a> - Jual Beli Mobil Padang Terpercaya</p>
      </div>
    </footer>

    <script>
    function blockToHtml(blocks) {
      if (!blocks) return '';
      let html = '';
      let listBuffer = [];
      let listType = null;

      const flushList = () => {
        if (listBuffer.length > 0) {
          html += `<${listType}>${listBuffer.join('')}</${listType}>`;
          listBuffer = [];
          listType = null;
        }
      };

      blocks.forEach(block => {
        if (block._type === 'block') {
          let text = block.children.map(child => {
            let html = child.text;
            if (child.marks?.includes('strong')) html = `<strong>${html}</strong>`;
            if (child.marks?.includes('em')) html = `<em>${html}</em>`;
            if (child.marks?.includes('underline')) html = `<u>${html}</u>`;
            if (child.marks?.includes('code')) html = `<code>${html}</code>`;
            return html;
          }).join('');
          
          // Auto convert **bold** jadi <strong>
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          
          // FIX FINAL: Pecah "1. Judul apapun" jadi H3 + paragraf baru
          // Gak peduli ada titik atau enggak di akhir
          text = text.replace(/(\d+\.\s+[^\n<]+)/g, '</p><h3>$1</h3><p>');
          
          // Hapus <p></p> kosong
          text = text.replace(/<p><\/p>/g, '');
          text = text.replace(/^<\/p>/, '');
          text = text.replace(/<p>$/, '');
          
          // Auto link Otopadang.com
          text = text.replace(/(Otopadang\.com)/gi, '<a href="https://otopadang.com" target="_blank">$1</a>');

          if (block.listItem === 'bullet') {
            if (listType !== 'ul') flushList();
            listType = 'ul';
            listBuffer.push(`<li>${text}</li>`);
          } else if (block.listItem === 'number') {
            if (listType !== 'ol') flushList();
            listType = 'ol';
            listBuffer.push(`<li>${text}</li>`);
          } else {
            flushList();
            const style = block.style || 'normal';
            if (style === 'h1') html += `<h1>${text}</h1>`;
            else if (style === 'h2') html += `<h2>${text}</h2>`;
            else if (style === 'h3') html += `<h3>${text}</h3>`;
            else if (style === 'blockquote') html += `<blockquote>${text}</blockquote>`;
            else html += `<p>${text}</p>`;
          }
        } else if (block._type === 'image') {
          flushList();
          html += `<img src="${block.asset.url}?w=1200&auto=format" alt="">`;
        }
      });
      flushList();
      return html;
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        document.getElementById('post-content').innerHTML = '<div class="error">Artikel tidak ditemukan</div>';
        return;
      }

      const PROJECT_ID = 'uzbsymrd';
      const DATASET = 'production';
      const QUERY = encodeURIComponent(`*[_type == "post" && slug.current == "${slug}"][0]{title, "imageUrl": mainImage.asset->url, "publishedAt": date, content[]{..., asset->}}`);
      const URL = `https://${PROJECT_ID}.apicdn.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;
      
      try {
        const res = await fetch(URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const { result: post } = await res.json();
        
        if(!post) {
            document.getElementById('post-content').innerHTML = '<div class="error">Artikel tidak ditemukan</div>';
            return;
        }

        document.title = post.title + ' - OtoPadang';
        const img = post.imageUrl ? `<img src="${post.imageUrl}?w=1200&auto=format" alt="${post.title}">` : '';
        const tgl = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : 'Baru dipublish';
        const bodyHtml = blockToHtml(post.content);

        document.getElementById('post-content').innerHTML = `
          <h1>${post.title}</h1>
          <p class="meta">Dipublish: ${tgl}</p>
          ${img}
          <div class="content">${bodyHtml || '<p>Belum ada isi artikel.</p>'}</div>
        `;
      } catch (e) {
        console.error(e);
        document.getElementById('post-content').innerHTML = `<div class="error">Gagal load artikel.<br>Error: ${e.message}</div>`;
      }
    }
    loadPost();
    </script>
</body>
</html>
