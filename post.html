<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - OtoPadang</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- SEO DINAMIS -->
    <meta name="description" content="">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="">
    
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="OtoPadang">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:url" content="">
    <meta property="og:locale" content="id_ID">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
          --brand: #0066cc;
          --brand-dark: #004d99;
          --text: #1a1a1a;
          --muted: #666;
          --bg: #fff;
          --border: #eee;
          --header-bg: #000;
          --header-yellow: #FFC107;
          --code-bg: #f5f5f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
          line-height: 1.8;
          color: var(--text);
          background: var(--bg);
        }
        
        /* HEADER */
        .site-header {
          background: var(--header-bg);
          border-bottom: 3px solid var(--header-yellow);
          padding: 12px 16px;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .header-inner {
          max-width: 1140px;
          margin: 0 auto;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .logo-img {
          width: 48px;
          height: 48px;
          object-fit: contain;
          flex-shrink: 0;
          background: #222;
          border-radius: 8px;
        }
        .logo-text {
          display: flex;
          flex-direction: column;
        }
        .logo-title {
          font-weight: 800;
          font-size: 20px;
          color: var(--header-yellow);
          line-height: 1.1;
        }
        .logo-subtitle {
          font-weight: 600;
          font-size: 11px;
          color: #fff;
          line-height: 1.2;
        }
        .nav {
          margin-left: auto;
        }
        .nav a {
          color: #fff;
          text-decoration: none;
          font-weight: 600;
          font-size: 15px;
          margin-left: 20px;
        }
        .nav a:hover { color: var(--header-yellow); }
        
        /* LAYOUT */
        .container {
          max-width: 1140px;
          margin: 0 auto;
          padding: 32px 16px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 40px;
        }
        @media (min-width: 1024px) {
          .container { grid-template-columns: 720px 1fr; }
        }
        .article-wrapper { max-width: 720px; }
        
        /* BREADCRUMB */
        .breadcrumb {
          font-size: 14px;
          color: var(--muted);
          margin-bottom: 16px;
        }
        .breadcrumb a {
          color: var(--brand);
          text-decoration: none;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        
        /* ARTIKEL */
        h1 { 
          font-family: 'Merriweather', serif;
          font-size: 2.5rem; 
          line-height: 1.2; 
          margin-bottom: 16px;
          font-weight: 700;
        }
        .post-meta-wrap {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          align-items: center;
          color: var(--muted); 
          font-size: 14px; 
          margin-bottom: 24px;
          padding-bottom: 24px;
          border-bottom: 1px solid var(--border);
        }
        .meta-item {
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .share-buttons {
          margin-left: auto;
          display: flex;
          gap: 8px;
        }
        .share-btn {
          width: 32px;
          height: 32px;
          border-radius: 8px;
          background: #f0f0f0;
          display: flex;
          align-items: center;
          justify-content: center;
          text-decoration: none;
          font-size: 16px;
          transition: all 0.2s;
        }
        .share-btn:hover { background: var(--brand); color: white; }
        
        .post-cover { 
          width: 100%; 
          border-radius: 16px; 
          margin: 24px 0 32px 0;
          box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        /* TYPOGRAPHY PREMIUM */
        .content {
          font-family: 'Merriweather', Georgia, serif;
          font-size: 18px;
          line-height: 1.9;
        }
        .content p { margin-bottom: 28px; }
        .content h2, .content h3 { 
          font-family: 'Inter', sans-serif;
          margin-top: 48px;
          margin-bottom: 16px;
          font-weight: 700;
          line-height: 1.3;
        }
        .content h2 { font-size: 1.8rem; }
        .content h3 { font-size: 1.4rem; }
        .content ul, .content ol { 
          padding-left: 28px; 
          margin-bottom: 28px;
        }
        .content li { margin-bottom: 12px; }
        .content strong { font-weight: 700; color: #000; }
        .content a {
          color: var(--brand);
          font-weight: 600;
          text-decoration: underline;
        }
        .content blockquote {
          border-left: 4px solid var(--brand);
          padding: 16px 0 16px 24px;
          margin: 32px 0;
          font-style: italic;
          font-size: 1.1rem;
          background: #f8f9fa;
          border-radius: 0 8px 8px 0;
        }
        .content img {
          max-width: 100%;
          border-radius: 12px;
          margin: 32px 0;
        }
        .content code {
          background: var(--code-bg);
          padding: 2px 6px;
          border-radius: 4px;
          font-family: monospace;
          font-size: 0.9em;
        }
        
        /* SIDEBAR */
        .sidebar {
          position: sticky;
          top: 100px;
          height: fit-content;
        }
        .sidebar-box {
          background: #fafafa;
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 24px;
          margin-bottom: 24px;
        }
        .sidebar-title {
          font-weight: 700;
          font-size: 18px;
          margin-bottom: 16px;
        }
        .toc-list {
          list-style: none;
        }
        .toc-list a {
          color: var(--muted);
          text-decoration: none;
          font-size: 14px;
          display: block;
          padding: 6px 0;
          line-height: 1.4;
        }
        .toc-list a:hover { color: var(--brand); }
        .related-item {
          display: flex;
          gap: 12px;
          margin-bottom: 16px;
          text-decoration: none;
          color: var(--text);
        }
        .related-item:hover .related-title { color: var(--brand); }
        .related-thumb {
          width: 80px;
          height: 60px;
          object-fit: cover;
          border-radius: 8px;
          flex-shrink: 0;
          background: #eee;
        }
        .related-title {
          font-weight: 600;
          font-size: 14px;
          line-height: 1.4;
        }
        
        .back-link {
          color: var(--brand);
          text-decoration: none;
          font-weight: 600;
          font-size: 15px;
          display: inline-block;
          margin-bottom: 16px;
        }
        .back-link:hover { text-decoration: underline; }
        .loading, .error { text-align: center; padding: 80px 20px; color: var(--muted); }
        .error { color: #c00; }
        
        /* FOOTER */
        .site-footer {
          border-top: 1px solid var(--border);
          padding: 32px 16px;
          margin-top: 60px;
          background: #fafafa;
        }
        .footer-inner {
          max-width: 1140px;
          margin: 0 auto;
          text-align: center;
          color: var(--muted);
          font-size: 14px;
        }
        .footer-inner a {
          color: var(--brand);
          text-decoration: none;
          font-weight: 600;
        }
        
        @media (max-width: 1024px) {
          .sidebar { display: none; }
          .container { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
          h1 { font-size: 1.9rem; }
          .content { font-size: 17px; }
          .logo-subtitle { display: none; }
          .nav a { margin-left: 12px; font-size: 14px; }
          .share-buttons { margin-left: 0; width: 100%; justify-content: flex-start; margin-top: 8px; }
          .container { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="header-inner">
        <img src="/logo.png" alt="OtoPadang" class="logo-img" onerror="this.style.display='none'">
        <div class="logo-text">
          <div class="logo-title">OTO PADANG</div>
          <div class="logo-subtitle">Kurator Mobil Bekas Terpercaya Sumatera Barat</div>
        </div>
        <nav class="nav">
          <a href="/blog.html">Blog</a>
          <a href="https://otopadang.com">Home</a>
        </nav>
      </div>
    </header>

    <!-- KONTEN -->
    <main class="container">
      <div class="article-wrapper">
        <div class="breadcrumb" id="breadcrumb"></div>
        <a href="/blog.html" class="back-link">← Kembali ke Blog</a>
        <div id="post-content" class="loading">Loading artikel...</div>
      </div>
      
      <aside class="sidebar">
        <div class="sidebar-box" id="toc-box" style="display:none;">
          <div class="sidebar-title">Daftar Isi</div>
          <ul class="toc-list" id="toc-list"></ul>
        </div>
        
        <div class="sidebar-box" id="related-box" style="display:none;">
          <div class="sidebar-title">Artikel Terkait</div>
          <div id="related-posts"></div>
        </div>
      </aside>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 <a href="https://otopadang.com">OtoPadang.com</a> - Jual Beli Mobil Padang Terpercaya</p>
      </div>
    </footer>

    <script type="application/ld+json" id="article-schema"></script>

    <script>
    const PROJECT_ID = 'uzbsymrd';
    const DATASET = 'production';
    
    function blockToHtml(blocks) {
      if (!blocks || !Array.isArray(blocks)) return '';
      let html = '';
      let listBuffer = [];
      let listType = null;

      const flushList = () => {
        if (listBuffer.length > 0) {
          html += `<${listType}>${listBuffer.join('')}</${listType}>`;
          listBuffer = [];
          listType = null;
        }
      };

      blocks.forEach(block => {
        if (block._type === 'block') {
          let text = block.children.map(child => {
            let t = child.text || '';
            if (child.marks?.includes('strong')) t = `<strong>${t}</strong>`;
            if (child.marks?.includes('em')) t = `<em>${t}</em>`;
            return t;
          }).join('');
          
          text = text.replace(/(Otopadang\.com)/gi, '<a href="https://otopadang.com" target="_blank" rel="noopener">$1</a>');

          if (block.listItem === 'bullet') {
            if (listType !== 'ul') flushList();
            listType = 'ul';
            listBuffer.push(`<li>${text}</li>`);
          } else if (block.listItem === 'number') {
            if (listType !== 'ol') flushList();
            listType = 'ol';
            listBuffer.push(`<li>${text}</li>`);
          } else {
            flushList();
            const style = block.style || 'normal';
            const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            if (style === 'h2') html += `<h2 id="${id}">${text}</h2>`;
            else if (style === 'h3') html += `<h3 id="${id}">${text}</h3>`;
            else if (style === 'blockquote') html += `<blockquote>${text}</blockquote>`;
            else html += `<p>${text}</p>`;
          }
        } else if (block._type === 'image' && block.asset?.url) {
          flushList();
          html += `<img src="${block.asset.url}?w=1200&auto=format&q=80" alt="" loading="lazy">`;
        }
      });
      flushList();
      return html;
    }
    
    function generateTOC() {
      const headings = document.querySelectorAll('.content h2, .content h3');
      if (headings.length < 2) return;
      
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      headings.forEach(h => {
        if (!h.id) return;
        const li = document.createElement('li');
        li.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
        if (h.tagName === 'H3') li.style.paddingLeft = '12px';
        tocList.appendChild(li);
      });
      document.getElementById('toc-box').style.display = 'block';
    }
    
    function getReadingTime(text) {
      const words = text.split(/\s+/).length;
      const minutes = Math.ceil(words / 200);
      return `${minutes} menit baca`;
    }

    async function loadRelatedPosts(currentId) {
      const QUERY = encodeURIComponent(`*[_type == "post" && !(_id in path("drafts.**")) && _id != "${currentId}"] | order(date desc)[0...3]{
        title, slug, "coverUrl": coalesce(coverImage.asset->url, mainImage.asset->url)
      }`);
      const URL = `https://${PROJECT_ID}.apicdn.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;
      
      try {
        const res = await fetch(URL);
        const { result } = await res.json();
        if (!result || result.length === 0) return;
        
        document.getElementById('related-posts').innerHTML = result.map(post => `
          <a href="post.html?slug=${post.slug.current}" class="related-item">
            ${post.coverUrl ? `<img src="${post.coverUrl}?w=160&h=120&fit=crop&q=80" class="related-thumb" alt="" loading="lazy">` : '<div class="related-thumb"></div>'}
            <div class="related-title">${post.title}</div>
          </a>
        `).join('');
        document.getElementById('related-box').style.display = 'block';
      } catch(e) { console.log('Related posts error:', e); }
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        document.getElementById('post-content').innerHTML = '<div class="error">Artikel tidak ditemukan. Slug kosong.</div>';
        return;
      }

      // SUPPORT coverImage ATAU mainImage
      const QUERY = encodeURIComponent(`*[_type == "post" && slug.current == "${slug}"][0]{
        _id, title, excerpt, date, 
        "coverUrl": coalesce(coverImage.asset->url, mainImage.asset->url), 
        body[]{..., asset->}
      }`);
      const URL = `https://${PROJECT_ID}.apicdn.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;
      
      try {
        const res = await fetch(URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const { result: post } = await res.json();
        
        console.log('DATA POST:', post);
        
        if(!post) {
            document.getElementById('post-content').innerHTML = '<div class="error">Artikel tidak ditemukan di Sanity</div>';
            return;
        }

        const pageUrl = `https://otopadang.com/post.html?slug=${slug}`;
        const imageUrl = post.coverUrl ? `${post.coverUrl}?w=1200&h=630&fit=crop&auto=format&q=80` : 'https://otopadang.com/og-image.jpg';
        const desc = post.excerpt || post.title;
        
        document.title = `${post.title} - OtoPadang`;
        document.querySelector('meta[name="description"]').content = desc;
        document.querySelector('link[rel="canonical"]').href = pageUrl;
        document.querySelector('meta[property="og:title"]').content = post.title;
        document.querySelector('meta[property="og:description"]').content = desc;
        document.querySelector('meta[property="og:image"]').content = imageUrl;
        document.querySelector('meta[property="og:url"]').content = pageUrl;
        document.querySelector('meta[name="twitter:title"]').content = post.title;
        document.querySelector('meta[name="twitter:description"]').content = desc;
        document.querySelector('meta[name="twitter:image"]').content = imageUrl;
        
        const tgl = post.date ? new Date(post.date).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : 'Baru dipublish';
        const bodyHtml = blockToHtml(post.body);
        const readingTime = getReadingTime(bodyHtml.replace(/<[^>]*>/g, ''));
        const shareUrl = encodeURIComponent(pageUrl);
        const shareTitle = encodeURIComponent(post.title);
        
        document.getElementById('breadcrumb').innerHTML = `<a href="/">Home</a> / <a href="/blog.html">Blog</a> / <span>${post.title}</span>`;
        
        document.getElementById('post-content').innerHTML = `
          <h1>${post.title}</h1>
          <div class="post-meta-wrap">
            <div class="meta-item">📅 ${tgl}</div>
            <div class="meta-item">⏱️ ${readingTime}</div>
            <div class="share-buttons">
              <a href="https://wa.me/?text=${shareTitle}%20${shareUrl}" target="_blank" class="share-btn" title="Share WhatsApp">💬</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn" title="Share Facebook">f</a>
              <a href="https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}" target="_blank" class="share-btn" title="Share Twitter">X</a>
            </div>
          </div>
          ${post.coverUrl ? `<img src="${post.coverUrl}?w=1200&auto=format&q=80" alt="${post.title}" class="post-cover">` : ''}
          <div class="content">${bodyHtml || '<p>Belum ada isi artikel.</p>'}</div>
        `;
        
        setTimeout(generateTOC, 100);
        loadRelatedPosts(post._id);
        
        const schema = {
          "@context": "https://schema.org",
          "@type": "Article",
          "headline": post.title,
          "description": desc,
          "image": imageUrl,
          "datePublished": post.date,
          "dateModified": post.date,
          "author": {"@type": "Organization","name": "OtoPadang","url": "https://otopadang.com"},
          "publisher": {"@type": "Organization","name": "OtoPadang","logo": {"@type": "ImageObject","url": "https://otopadang.com/logo.png"}},
          "mainEntityOfPage": pageUrl
        };
        document.getElementById('article-schema').textContent = JSON.stringify(schema);
        
      } catch (e) {
        console.error(e);
        document.getElementById('post-content').innerHTML = `<div class="error">Gagal load artikel.<br>Error: ${e.message}<br><br>Buka Console [F12] buat liat detail error.</div>`;
      }
    }
    loadPost();
    </script>
</body>
</html>
